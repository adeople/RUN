<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>RUN · 润 | 移居路线抉择器</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1b2a28;
    --muted: #687976;
    --line: #e6e2d8;
    --teal: #0f766e;
    --teal-dark: #0b5d57;
    --teal-soft: #e7f3f1;
    --amber: #b45309;
    --amber-soft: #fdf3e3;
    --red: #b91c1c;
    --shadow: 0 18px 50px rgba(27, 42, 40, 0.08);
    --radius: 22px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 50% -160px, #dcefe9 0%, rgba(220, 239, 233, 0) 70%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 20px 44px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
    color: var(--teal-dark);
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .brand-mark {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: linear-gradient(145deg, var(--teal), #14a394);
    color: #fff;
    font-size: 17px;
    box-shadow: 0 6px 16px rgba(15, 118, 110, 0.28);
  }

  .brand small {
    display: block;
    color: var(--muted);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .screen { animation: rise 0.35s ease both; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid #cfe3df;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.7);
    color: var(--teal-dark);
    font-size: 13px;
    font-weight: 600;
  }

  h1 {
    margin: 18px 0 12px;
    font-size: clamp(32px, 6vw, 52px);
    line-height: 1.15;
    letter-spacing: -0.025em;
  }

  h1 span { color: var(--teal); }

  .lead {
    max-width: 620px;
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 16px;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 0 0 30px;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding: 10px 15px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.66);
    font-size: 13px;
    color: var(--muted);
  }

  .stat b { color: var(--ink); font-size: 19px; line-height: 1; }

  .primary, .ghost {
    appearance: none;
    border: 0;
    border-radius: 14px;
    padding: 14px 22px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  .primary {
    background: linear-gradient(145deg, var(--teal), var(--teal-dark));
    color: #fff;
    box-shadow: 0 10px 26px rgba(15, 118, 110, 0.24);
  }

  .primary:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(15, 118, 110, 0.3); }

  .ghost {
    background: #fff;
    color: var(--teal-dark);
    border: 1px solid #cfe3df;
  }

  .ghost:hover { background: var(--teal-soft); }

  .primary:focus-visible, .ghost:focus-visible, .option:focus-visible, .doc-link:focus-visible {
    outline: 3px solid rgba(15, 118, 110, 0.35);
    outline-offset: 3px;
  }

  .fine {
    margin: 18px 0 0;
    color: var(--muted);
    font-size: 12.5px;
  }

  /* ---------- 问题页 ---------- */
  .question-card {
    padding: clamp(22px, 4vw, 38px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .progress-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .progress {
    height: 7px;
    margin-bottom: 28px;
    border-radius: 999px;
    background: #eeeae1;
    overflow: hidden;
  }

  .progress i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--teal), #14a394);
    transition: width 0.28s ease;
  }

  h2 {
    margin: 0 0 8px;
    font-size: clamp(23px, 4vw, 31px);
    line-height: 1.3;
    letter-spacing: -0.015em;
  }

  .hint {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 14.5px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .option {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    padding: 16px;
    border: 1.5px solid var(--line);
    border-radius: 16px;
    background: #fcfbf8;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
  }

  .option:hover {
    border-color: #9fd0c9;
    background: var(--teal-soft);
    transform: translateY(-1px);
  }

  .option.selected {
    border-color: var(--teal);
    background: var(--teal-soft);
  }

  .opt-icon {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: #fff;
    font-size: 20px;
    box-shadow: 0 2px 8px rgba(27, 42, 40, 0.06);
  }

  .opt-body { display: block; }

  .opt-body b {
    display: block;
    margin-bottom: 3px;
    font-size: 14.5px;
    line-height: 1.4;
  }

  .opt-body small {
    display: block;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
  }

  .opt-check {
    position: absolute;
    top: 12px;
    right: 12px;
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--teal);
    color: #fff;
    font-size: 12px;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.16s ease, transform 0.16s ease;
  }

  .option.selected .opt-check { opacity: 1; transform: scale(1); }

  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-top: 22px;
  }

  .nav .fine { margin: 0; }

  /* ---------- 结果页 ---------- */
  .result-head h2 { margin-bottom: 6px; }

  .answer-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 24px;
  }

  .answer-strip span {
    padding: 7px 12px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12.5px;
  }

  .result-list { display: grid; gap: 16px; }

  .result-card {
    position: relative;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: 0 12px 34px rgba(27, 42, 40, 0.06);
  }

  .result-card.top {
    border-color: #a9d8d0;
    box-shadow: 0 20px 46px rgba(15, 118, 110, 0.14);
  }

  .rank {
    position: absolute;
    top: -11px;
    left: 22px;
    padding: 3px 12px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #cfe3df;
    color: var(--teal-dark);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .result-card.top .rank {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }

  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    margin-top: 4px;
  }

  .flag {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--teal-soft);
    color: var(--teal-dark);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  .card-head h3 {
    margin: 0 0 2px;
    font-size: 19px;
    line-height: 1.35;
  }

  .card-head p {
    margin: 0;
    color: var(--muted);
    font-size: 12.5px;
  }

  .match {
    margin-left: auto;
    flex: 0 0 auto;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    white-space: nowrap;
  }

  .match.high { background: var(--teal-soft); color: var(--teal-dark); }
  .match.mid { background: #eef3fb; color: #2458a6; }
  .match.low { background: #f2f0ea; color: var(--muted); }

  .summary {
    margin: 14px 0;
    color: #33433f;
    font-size: 14.5px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .chips span {
    padding: 6px 10px;
    border-radius: 10px;
    background: #f6f4ee;
    color: #43534f;
    font-size: 12px;
    white-space: nowrap;
  }

  .reasons, .warnings {
    display: grid;
    gap: 5px;
    margin: 8px 0 0;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
  }

  .reasons { background: #f2faf8; color: #285b54; }
  .warnings { background: var(--amber-soft); color: #7a4c0a; }

  .reasons b, .warnings b { font-size: 12px; letter-spacing: 0.04em; }

  .global-warning {
    margin: 0 0 18px;
    padding: 13px 16px;
    border: 1px solid #f0d7ae;
    border-radius: 14px;
    background: var(--amber-soft);
    color: #7a4c0a;
    font-size: 13.5px;
    line-height: 1.6;
  }

  .result-note {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 13px;
  }

  .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 16px;
  }

  .doc-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--teal-dark);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    border-bottom: 1px dashed #9fd0c9;
  }

  .doc-link:hover { border-bottom-style: solid; }

  .result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 26px;
  }

  footer {
    margin-top: 38px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  footer a { color: var(--teal-dark); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer p { margin: 4px 0; overflow-wrap: anywhere; }

  @media (max-width: 680px) {
    .app { padding: 20px 14px 36px; }
    .options { grid-template-columns: 1fr; }
    .question-card { padding: 20px 16px; }
    .result-card { padding: 20px 16px; }
    .card-head { flex-wrap: wrap; }
    .match { margin-left: 0; }
    h1 { font-size: 34px; }
    .stats { gap: 8px; }
    .stat { padding: 8px 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

/* ============================================================
 * 3. 打分逻辑
 * ============================================================ */
function evaluate(route, answers) {
  const income = answers.income;
  const exact = route.category === income;
  if (!exact && !(COMPAT[income] || []).includes(route.category)) return null;

  let score = 10;
  const reasons = [];
  const warnings = [];

  if (exact) {
    score += 55;
    reasons.push('收入来源直接匹配');
  } else {
    score += 15;
    reasons.push('与你的主线相关');
  }

  // 预算
  if (answers.budget < route.minCash) {
    score -= 110;
    warnings.push('资金门槛可能超出你的预算');
  } else {
    score += (answers.budget - route.minCash) * 4;
    if (route.minCash <= 2) reasons.push('前期资金压力相对可控');
    else reasons.push('预算可覆盖该路线的前期资金');
  }

  // 语言
  const englishOnly = answers.language !== 'learn';
  if (route.needsLocal) {
    if (answers.language === 'learn') {
      score += 12;
      reasons.push('你愿意学当地语言，适合长期路线');
    } else {
      score -= 35;
      warnings.push('长期身份通常需要当地语言（如德语 B1）');
    }
  }
  if (route.english >= 2) {
    score += englishOnly ? 18 : 8;
    if (englishOnly) reasons.push('英语环境友好');
  } else if (englishOnly) {
    score -= 10;
  }

  // 家属
  if (answers.family > 0) {
    if (route.family === 'no') {
      score -= 100;
      warnings.push('该路线不能带家属');
    } else if (route.family === 'limited') {
      score -= 20;
      warnings.push('家属政策需逐项核查');
    } else {
      score += 15;
      reasons.push('支持家庭成员随行');
    }
  }

  // 核心偏好
  const p = answers.priority;
  if (p === 'speed') {
    score += route.speed * 7;
    if (route.speed >= 4) reasons.push('拿身份速度较快');
    if (route.speed <= 2) warnings.push('拿永居 / 入籍的周期偏长');
  } else if (p === 'lowCost') {
    score += route.lowCost * 7;
    if (route.lowCost >= 4) reasons.push('前期成本较低');
  } else if (p === 'english') {
    score += route.english * 12;
    if (route.english >= 2) reasons.push('英语环境匹配');
    if (route.english <= 1) warnings.push('当地英语普及度一般');
  } else if (p === 'minimalStay') {
    score += route.minimalStay * 8;
    if (route.minimalStay >= 4) reasons.push('居住要求较宽松');
    else warnings.push('这类路线通常需要实际居住');
  } else if (p === 'easyEntry') {
    score += route.easyEntry * 7;
    if (route.easyEntry >= 4) reasons.push('门槛较低，容易先拿到居留');
  }

  if (route.temporary) warnings.push('临时身份，未必能直接累积永居');
  if (route.note) warnings.push(route.note);

  return {
    route,
    score,
    reasons: [...new Set(reasons)].slice(0, 3),
    warnings: [...new Set(warnings)].slice(0, 2)
  };
}

function rankRoutes(answers) {
  const scored = [];
  for (const route of ROUTES) {
    const result = evaluate(route, answers);
    if (result) scored.push(result);
  }
  scored.sort((a, b) => b.score - a.score);

  // 优先保留非负分路线；若全部为负，则展示“最不差”的备选
  const positive = scored.filter((item) => item.score >= 0);
  const pool = positive.length ? positive : scored;

  // 前三名尽量来自不同国家，避免三张卡片都是同一国
  const picked = [];
  const seen = new Set();
  for (const item of pool) {
    if (seen.has(item.route.country)) continue;
    picked.push(item);
    seen.add(item.route.country);
    if (picked.length === 3) break;
  }
  return { top: picked, total: scored.length, allNegative: positive.length === 0 };
}

function matchLabel(score) {
  if (score >= 140) return { text: '高度匹配', cls: 'high' };
  if (score >= 105) return { text: '较匹配', cls: 'mid' };
  if (score >= 70) return { text: '可考虑', cls: 'low' };
  return { text: '备选', cls: 'low' };
}

function familyText(route) {
  if (route.family === 'yes') return '可带家属';
  if (route.family === 'limited') return '家属需核查';
  return '不能带家属';
}

function languageText(route) {
  if (route.english >= 2) return '英语友好';
  if (route.needsLocal) return '需当地语言';
  return '无硬性语言要求';
}

/* 暴露给 Node 做逻辑测试；浏览器里不影响使用 */
if (typeof globalThis !== 'undefined') {
  globalThis.__RUN_CHOOSER__ = { QUESTIONS, ROUTES, evaluate, rankRoutes };
}
</script>

<script>
/* ============================================================
 * 4. 界面
 * ============================================================ */
(function () {
  const app = document.getElementById('app');
  const state = { income: null, budget: null, language: null, family: null, priority: null };
  let current = 0;
  let locked = false;

  const byId = (id) => document.getElementById(id);

  function renderStart() {
    app.innerHTML = `
      <section class="screen">
        <span class="badge">RUN · 润 路线抉择器</span>
        <h1>用 5 个问题，<br><span>找到适合你的移居路线</span></h1>
        <p class="lead">基于 RUN 手册的 36 个欧洲国家、110 条路线整理。纯本地运行，不上传任何答案。</p>
        <div class="stats">
          <div class="stat"><b>36</b> 个欧洲国家</div>
          <div class="stat"><b>110</b> 条路线</div>
          <div class="stat"><b>399</b> 条来源</div>
          <div class="stat"><b>5</b> 个问题</div>
        </div>
        <button class="primary" id="startBtn">开始测试 →</button>
        <p class="fine">按中国大陆普通护照设计 · 结果仅供初筛，不构成移民 / 法律 / 投资建议</p>
      </section>
    `;
    byId('startBtn').addEventListener('click', () => {
      current = 0;
      renderQuestion();
    });
  }

  function renderQuestion() {
    locked = false;
    const q = QUESTIONS[current];
    const selected = state[q.key];
    const progress = ((current) / QUESTIONS.length) * 100;

    app.innerHTML = `
      <section class="screen">
        <div class="question-card">
          <div class="progress-head">
            <span>第 ${current + 1} / ${QUESTIONS.length} 题</span>
            <span>${Math.round(progress)}%</span>
          </div>
          <div class="progress"><i style="width:${progress}%"></i></div>
          <h2>${q.title}</h2>
          <p class="hint">${q.hint}</p>
          <div class="options">
            ${q.options.map((o) => `
              <button class="option ${selected === o.value ? 'selected' : ''}" data-value="${o.value}" type="button">
                <span class="opt-icon">${o.icon}</span>
                <span class="opt-body">
                  <b>${o.title}</b>
                  <small>${o.desc}</small>
                </span>
                <span class="opt-check">✓</span>
              </button>
            `).join('')}
          </div>
          <div class="nav">
            ${current > 0
              ? '<button class="ghost" id="backBtn" type="button">← 上一题</button>'
              : '<span></span>'}
            <span class="fine">选择后自动进入下一题</span>
          </div>
        </div>
      </section>
    `;

    app.querySelectorAll('.option').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (locked) return;
        locked = true;
        const raw = btn.dataset.value;
        state[q.key] = (q.key === 'budget' || q.key === 'family') ? Number(raw) : raw;
        btn.classList.add('selected');

        window.setTimeout(() => {
          if (current < QUESTIONS.length - 1) {
            current += 1;
            renderQuestion();
          } else {
            renderResults();
          }
        }, 170);
      });
    });

    if (current > 0) {
      byId('backBtn').addEventListener('click', () => {
        current -= 1;
        renderQuestion();
      });
    }
  }

  function answerLabel(key) {
    const q = QUESTIONS.find((item) => item.key === key);
    const opt = q && q.options.find((o) => o.value === state[key]);
    return opt ? opt.title : '';
  }

  function renderResults() {
    const { top, total, allNegative } = rankRoutes(state);
    const answers = ['income', 'budget', 'language', 'family', 'priority']
      .map(answerLabel)
      .filter(Boolean);

    if (!top.length) {
      app.innerHTML = `
        <section class="screen">
          <span class="badge">测试结果</span>
          <h2>没有找到合适的路线</h2>
          <p class="hint">按当前条件，所有路线都在预算、家属或语言上有明显冲突。建议放宽预算，或先走工作 / 留学 / 数字游民路线。</p>
          <button class="primary" id="restartBtn" type="button">重新测试</button>
        </section>
      `;
      byId('restartBtn').addEventListener('click', () => {
        current = 0;
        for (const key of Object.keys(state)) state[key] = null;
        renderStart();
      });
      return;
    }

    const budgetBlocked = top.every((item) =>
      item.warnings.some((w) => w.includes('超出你的预算'))
    );
    const residenceConflict = state.priority === 'minimalStay' &&
      top.every((item) => item.route.minimalStay < 4);

    const cards = top.map((item, index) => {
      const route = item.route;
      const label = matchLabel(item.score);
      const rankText = index === 0 ? '最匹配' : index === 1 ? '次选' : '备选';
      return `
        <article class="result-card ${index === 0 ? 'top' : ''}">
          <span class="rank">${rankText}</span>
          <div class="card-head">
            <span class="flag" aria-hidden="true">${COUNTRY_CODE[route.country] || route.flag}</span>
            <div>
              <h3>${route.name}</h3>
              <p>${route.country} · ${CATEGORY_LABEL[route.category]}</p>
            </div>
            <span class="match ${label.cls}">${label.text}</span>
          </div>
          <p class="summary">${route.summary}</p>
          <div class="chips">
            <span>💰 ${route.threshold}</span>
            <span>👨‍👩‍👧 ${familyText(route)}</span>
            <span>🛂 ${route.pr}</span>
            <span>🗣️ ${languageText(route)}</span>
          </div>
          ${item.reasons.length ? `
            <div class="reasons">
              <b>为什么匹配</b>
              ${item.reasons.map((r) => `<span>✓ ${r}</span>`).join('')}
            </div>` : ''}
          ${item.warnings.length ? `
            <div class="warnings">
              <b>需要注意</b>
              ${item.warnings.map((w) => `<span>⚠ ${w}</span>`).join('')}
            </div>` : ''}
          <div class="card-actions">
            <a class="doc-link" href="${route.link}" target="_blank" rel="noopener">查看国家页 →</a>
            <a class="doc-link" href="${GUIDE_LINKS[route.category]}" target="_blank" rel="noopener">路线指南 →</a>
          </div>
        </article>
      `;
    }).join('');

    app.innerHTML = `
      <section class="screen">
        <span class="badge">测试结果 · 共 ${total} 条候选</span>
        <div class="result-head">
          <h2>给你的 ${top.length} 条路线</h2>
          <p class="hint">按你的收入来源、预算、语言、家属情况和核心偏好排序。</p>
        </div>
        <div class="answer-strip">
          ${answers.map((a) => `<span>${a}</span>`).join('')}
        </div>
        ${allNegative || budgetBlocked ? `
          <div class="global-warning">
            ⚠ 你的预算低于这些路线的资金门槛。建议先考虑工作、留学或数字游民路线，或提高预算后再看投资 / 被动收入类。
          </div>` : ''}
        ${residenceConflict ? `
          <div class="global-warning">
            ⚠ 你选了“不想坐移民监”，但当前收入类型下的主流路线仍有居住要求。若预算允许，可考虑投资居留 / 黄金签证类（通常需 100 万+ 预算）。
          </div>` : ''}
        ${top.length < 3 ? `
          <p class="result-note">只有 ${top.length} 条路线与你的条件基本匹配；其余路线在预算、家属或语言上有明显冲突，未列入。</p>` : ''}
        <div class="result-list">${cards}</div>
        <div class="result-actions">
          <button class="primary" id="restartBtn" type="button">重新测试</button>
          <button class="ghost" id="copyBtn" type="button">复制结果</button>
        </div>
        <p class="fine">数字为 2026-10 手册整理的约值，政策变化很快；点开官方来源核对后再做决定。</p>
      </section>
    `;

    byId('restartBtn').addEventListener('click', () => {
      current = 0;
      for (const key of Object.keys(state)) state[key] = null;
      renderStart();
    });

    byId('copyBtn').addEventListener('click', () => {
      const lines = [
        'RUN · 润 路线抉择结果',
        '',
        '你的情况：' + answers.join(' / '),
        '',
        ...top.map((item, i) => {
          const r = item.route;
          return [
            `${i + 1}. ${COUNTRY_CODE[r.country] || r.flag} ${r.country} · ${r.name}`,
            `   门槛：${r.threshold}`,
            `   家属：${familyText(r)} ｜ 永居/身份：${r.pr}`,
            `   链接：${r.link}`
          ].join('\n');
        }),
        '',
        '仅供初筛，不构成移民/法律/投资建议；以官方页面为准。'
      ];
      copyText(lines.join('\n'), byId('copyBtn'));
    });
  }

  function copyText(text, button) {
    const done = () => {
      const old = button.textContent;
      button.textContent = '已复制 ✓';
      window.setTimeout(() => { button.textContent = old; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
    document.body.removeChild(area);
  }

  renderStart();
})();
</script>
</body>
</html>
